name: Findly
options:
  bundleIdPrefix: com.findly
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "15"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "746D2K3RJV"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_PREVIEWS: YES

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.0.0"

targets:
  Findly:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Findly
      - path: Shared
    info:
      path: Findly/Resources/Info.plist
      properties:
        CFBundleDisplayName: Findly
        CFBundleIconName: AppIcon
        CFBundleIdentifier: com.findlyvikas.app
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.REPLACE_WITH_REVERSED_CLIENT_ID
        BGTaskSchedulerPermittedIdentifiers:
          - com.findlyvikas.app.sync
          - com.findlyvikas.app.periodic-backup
        UIBackgroundModes:
          - processing
        NSPhotoLibraryUsageDescription: "Findly needs access to your photo library to add images and videos to your vault."
        NSCameraUsageDescription: "Findly needs camera access to capture photos and videos for your vault."
        NSMicrophoneUsageDescription: "Findly needs microphone access to record audio notes."
        NSFaceIDUsageDescription: "Findly uses Face ID to protect your private vault."
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: false
    entitlements:
      path: Findly/Resources/Findly.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.findlyvikas.app
    dependencies:
      - target: FindlyShare
        embed: true
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.findlyvikas.app
        INFOPLIST_FILE: Findly/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Findly/Resources/Findly.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  FindlyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - FindlyTests
    dependencies:
      - target: Findly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.findlyvikas.appTests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"

  FindlyShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: FindlyShare
      - path: Shared
      - path: Findly/Models/Enums/FileType.swift
      - path: Findly/Models/Enums/SyncStatus.swift
      - path: Findly/Core/AppTheme.swift
      - path: Findly/Core/Extensions/Color+Hex.swift
    info:
      path: FindlyShare/Resources/Info.plist
      properties:
        CFBundleDisplayName: Findly
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSFaceIDUsageDescription: "Findly uses Face ID to protect your vault when saving shared files."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule: 'extensionItems.@count == 1 AND SUBQUERY(extensionItems, $item, $item.attachments.@count == 1 AND SUBQUERY($item.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text").@count == 1).@count == 1'
    entitlements:
      path: FindlyShare/Resources/FindlyShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.findlyvikas.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.findlyvikas.app.share
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
